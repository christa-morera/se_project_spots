<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="description" content="Social media site intended for sharing images."/><meta name="author" content="Christa Morera"/><meta name="keywords" content="Image sharing social media"/><title>Spots</title><link href="./favicon.ico" rel="shortcut icon" type="image/x-icon"/><link rel="icon" href="favicon.ico"><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body><div class="page"><header class="header"><img src="e793829a1f9e21f462b1.svg" alt="Spots logo" class="header__logo"/></header><main class="content"><section class="profile page__section"><div class="profile__avatar-container"><button type="button" class="profile__avatar-btn"><img src="466fba40d06de23ed0a1.svg" alt="pencil icon" class="profile__pencil-icon"/></button> <img src="2fc47fd8e9a9bcd9612f.jpg" alt="Avatar Image" class="profile__avatar"/></div><div class="profile__column"><h1 class="profile__name">Bessie Coleman</h1><p class="profile__description">Civil Aviator</p><button type="button" class="profile__edit-btn"><img src="d38272e02bb4f1ab1c37.svg" alt="pencil icon"/>Edit Profile</button></div><button type="button" class="profile__new-post-btn"><img src="40608da7369d39bc1077.svg" alt="plus icon"/> New Post</button></section><section class="cards page__section"><ul class="cards__list"><template id="card-template"><li class="card"><button class="card__delete-btn" type="button" aria-label="delete button"></button> <img class="card__image" src="#" alt=""/><div class="card__content"><h2 class="card__title"></h2><button class="card__like-btn" type="button" aria-label="Like button"></button></div></li></template></ul></section></main><footer class="footer page__section"><p class="footer__text">2025 &copy; Spots</p></footer><div class="modal" id="edit-profile-modal"><div class="modal__container"><button type="button" aria-label="Close form button" class="modal__close-btn"><img src="9335fea30fb8c9c34f64.svg" alt="close button"/></button><h2 class="modal__title">Edit profile</h2><form class="modal__form" novalidate><label for="profile-name-input" class="modal__label">Name <input id="profile-name-input" class="modal__input" placeholder="Type your name here" minlength="2" maxlength="40" required/> <span id="profile-name-input-error" class="modal__input-error"></span></label> <label for="profile-description-input" class="modal__label">Description <input id="profile-description-input" class="modal__input" placeholder="Describe yourself" minlength="2" maxlength="200" required/> <span id="profile-description-input-error" class="modal__input-error"></span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div><div class="modal" id="new-post-modal"><div class="modal__container"><button type="button" aria-label="Close form button" class="modal__close-btn"><img src="9335fea30fb8c9c34f64.svg" alt="close button"/></button><h2 class="modal__title">New Post</h2><form class="modal__form" novalidate><label for="image-link-input" class="modal__label">Image link <input id="image-link-input" type="url" class="modal__input" placeholder="Paste a link to the picture" required/> <span id="image-link-input-error" class="modal__input-error"></span></label> <label for="image-caption-input" class="modal__label">Caption <input id="image-caption-input" class="modal__input" placeholder="Type your caption" minlength="2" maxlength="30" required/> <span id="image-caption-input-error" class="modal__input-error"></span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div><div class="modal modal_type_preview" id="preview-modal"><div class="modal__content"><button type="button" aria-label="Close form button" class="modal__close-btn modal__close-btn_type_preview"><img src="8fd62550d2f8a12ff952.svg" alt="close button"/></button> <img class="modal__image" src="#" alt=""/><p class="modal__caption"></p></div></div><div class="modal" id="avatar-modal"><div class="modal__container"><button type="button" aria-label="Close form button" class="modal__close-btn"><img src="9335fea30fb8c9c34f64.svg" alt="close button"/></button><h3 class="modal__title">Edit profile avatar</h3><form class="modal__form" id="edit-avatar-form" novalidate><label for="profile-avatar-input" class="modal__label">Profile Picture <input id="profile-avatar-input" type="url" name="avatar" class="modal__input" placeholder="Paste the link to an image" required/> <span id="profile-avatar-input-error" class="modal__input-error"></span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div><div class="modal" id="delete-modal"><div class="modal__container"><button type="button" aria-label="Close form button" class="modal__close-btn modal__close-btn_type_delete"><img src="8fd62550d2f8a12ff952.svg" alt="close button"/></button><h3 class="modal__title">Are you sure you want to delete this image?</h3><form class="modal__form" id="delete-form" novalidate><div class="modal__btn-container"><button type="submit" class="modal__btn modal__btn_type_delete">Delete</button> <button type="button" class="modal__btn modal__btn_type_cancel">Cancel</button></div></form></div></div></div></body></html>
